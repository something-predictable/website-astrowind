site:
  name: Project Name
  site: 'https://project.name'
  base: '/'
  trailingSlash: false

metadata:
  title:
    default: Project Name
    template: '%s — Project Name'
  description: "Project Name description."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Project Name
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: 'articles/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'articles'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

ui:
  theme: 'system'
